[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_mint"
version = "0.2.0"
description = "MINT-4B policy plugin for LeRobot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot==0.5.1",
    "omegaconf>=2.3.0",
    "scipy>=1.10.1,<1.15",
    "einops>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
