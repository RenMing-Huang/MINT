[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_mint_light"
version = "1.0.0"
description = "MINT-Light policy plugin for LeRobot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot==0.5.1",
    "torch>=2.2.0",
    "accelerate>=1.2.1",
    "omegaconf>=2.3.0",
    "numpy>=1.24.0",
    "einops>=0.8.0",
    "timm>=1.0.20",
    "transformers>=4.53.0",
    "huggingface-hub>=0.34.2",
    "safetensors>=0.4.3",
]

[tool.setuptools.packages.find]
where = ["src"]
